name: Bootstrap (one-time)

# One-time kickstart: seeds data/ from scratch, retrains both models on the
# fresh history, then generates the first forecast - in that order, in a
# single job, so the forecast never runs against stale models.
#
# Delete this file once it has run successfully once.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Weekly retrain (kickstart - runs first so the forecast below uses fresh models)
        env:
          PYTHONPATH: .
        run: |
          python -m src.retrain

      - name: Daily forecast (kickstart)
        env:
          PYTHONPATH: .
        run: |
          python -m src.automation

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/
          git diff --cached --quiet || git commit -m "chore: one-time bootstrap (retrain + forecast)"
          git push
