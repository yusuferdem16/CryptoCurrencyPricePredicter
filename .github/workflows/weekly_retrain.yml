name: Weekly Model Retrain

on:
  schedule:
    # Runs at 06:00 UTC every Sunday, an hour after the daily forecast job
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # requirements-pipeline.txt pulls in requirements.txt too
    - name: Install libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-pipeline.txt

    # Retrains the Bi-LSTM and SARIMAX models on the latest data and
    # overwrites the artifacts in models/. No secrets needed.
    - name: Run Weekly Retrain
      env:
        PYTHONPATH: .
      run: |
        python -m src.retrain

    - name: Commit updated models and data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add models/ data/
        git diff --cached --quiet || git commit -m "chore: weekly model retrain $(date -u +%F)"
        git push
