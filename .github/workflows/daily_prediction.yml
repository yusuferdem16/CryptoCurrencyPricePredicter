name: Daily Crypto Forecast

on:
  schedule:
    # Runs at 05:00 UTC every day (which is 08:00 AM Turkey Time)
    - cron: '0 5 * * *'
  # Allows you to click a button in GitHub to run it manually for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install Dependencies
    - name: Install libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run the Automation Script
    # No database or API secrets needed: data lives in data/ and models/,
    # both committed straight back to the repo below.
    - name: Run Daily Job
      env:
        PYTHONPATH: .
      run: |
        python -m src.automation

    # 5. Commit the refreshed data/predictions back to the repo.
    # The Streamlit Community Cloud app auto-redeploys on every push to this
    # branch, so this push is what makes the dashboard show today's numbers.
    - name: Commit updated data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff --cached --quiet || git commit -m "chore: daily data refresh $(date -u +%F)"
        git push
